<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DalFound – Staff</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">DalFound</a>
    <nav>
      <a href="index.html">Browse</a>
      <a href="post.html">Post a found item</a>
      <a href="staff.html">Staff</a>
    </nav>
  </header>

  <main>
    <h1>Staff</h1>

    <!-- WBS 1.4.1: Staff login and access rules -->
    <section aria-label="Staff access">

      <div id="loading-view" role="status" aria-live="polite" hidden>
        <p>Checking staff access...</p>
      </div>

      <div id="login-view">
        <h2>Staff login</h2>
        <p>Sign in with your authorized staff account.</p>

        <form id="login-form">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email"
                 autocomplete="username" required>

          <label for="password">Password</label>
          <input id="password" name="password" type="password"
                 autocomplete="current-password" required>

          <button id="login-btn" type="submit">Sign in</button>
        </form>

        <p id="login-error" role="alert"></p>
      </div>

      <div id="staff-view" hidden>
        <h2>Staff dashboard</h2>
        <p id="signed-in-as"></p>

        <!-- WBS 1.4.2: Staff features -->

        <h3>Claim requests and item management</h3>

        <p id="staff-message"></p>

        <!-- WBS 1.4.3: Staff features -->

        <div id="staff-item-list"></div>

        <br>

        <button id="signout-btn" type="button">Sign out</button>
      </div>

    </section>
  </main>

  <footer class="site-footer">
    <p>DalFound – CSCI 2690 Team 6 prototype. Sample data only.</p>
  </footer>

  <script type="module" src="js/staff.js"></script>
</body>
</html>
