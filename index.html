<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DalFound – Found items</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">DalFound</a>
    <nav>
      <a href="index.html">Browse</a>
      <a href="post.html">Post a found item</a>
      <a href="staff.html">Staff</a>
    </nav>
  </header>

  <main>
    <h1>Found items</h1>
        <!-- Filters (WBS 1.2.2) -->
        <section class="filters">
          <label>
            Category
            <select id="filter-category">
              <option value="">All categories</option>
            </select>
          </label>
    
          <label>
            Location found
            <select id="filter-location">
              <option value="">All locations</option>
            </select>
          </label>
    
          <button type="button" id="clear-filters">Clear filters</button>
        </section>
    
        <!-- Item listing (WBS 1.2.1). Cards are added by js/listing.js. -->
        <p id="empty-message" hidden></p>
        <div id="item-list" class="item-list"></div>

    <dialog id="claim-dialog" class="claim-dialog">
      <form id="claim-form" novalidate>
        <div class="claim-header">
          <h2>Claim this item</h2>
          <button type="button" id="claim-close">Close</button>
        </div>

        <img id="claim-photo" alt="">
        <p id="claim-category" class="item-category"></p>
        <p class="claim-note">Staff will email you to arrange pickup and will check your ID in person.</p>

        <p id="claim-message" class="form-message" hidden></p>

        <div class="form-field">
          <label for="claim-name">Name</label>
          <input id="claim-name" name="name" type="text" autocomplete="name">
        </div>

        <div class="form-field">
          <label for="claim-email">Contact email</label>
          <input id="claim-email" name="email" type="email" autocomplete="email">
        </div>

        <div class="form-field">
          <label for="claim-detail">Specific detail</label>
          <textarea id="claim-detail" name="detail" rows="3"></textarea>
          <span class="field-hint">Describe something only the owner would know.</span>
        </div>

        <button type="submit">Send claim</button>
      </form>
    </dialog>

    <dialog id="photo-viewer" class="photo-viewer" aria-label="Item photo">
      <img id="photo-viewer-img" alt="">
      <button type="button" id="photo-viewer-close">Close</button>
    </dialog>
  </main>

  <footer class="site-footer">
    <p>DalFound – CSCI 2690 Team 6 prototype. Sample data only.</p>
  </footer>

  <script type="module" src="js/browse.js"></script>
  <script type="module" src="js/listing.js"></script>
</body>
</html>
